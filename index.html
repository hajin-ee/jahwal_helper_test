.doc.got{animation:none;transform:translateY(-14px) scale(1.5) rotate(15deg);opacity:0}

const u=s=>Uint8Array.from(atob(s),c=>c.charCodeAt(0));
const b6=a=>btoa(String.fromCharCode(...a));
async function open_(pw,greet){
  pw=String(pw).trim().toLowerCase(); if(pw.includes("@")) pw=pw.split("@")[0];   /* 센터 이메일 전체를 넣어도 아이디 부분만 쓴다 */
  const base=await crypto.subtle.importKey("raw",new TextEncoder().encode(pw.trim()),"PBKDF2",false,["deriveBits"]);
  const bits=new Uint8Array(await crypto.subtle.deriveBits({name:"PBKDF2",salt:u(D.s),iterations:D.n,hash:"SHA-256"},base,512));
  const ent=D.e.find(x=>x.id===b6(bits.slice(0,16))); if(!ent) throw new Error("no");
  const w=await crypto.subtle.importKey("raw",bits.slice(16,48),"AES-GCM",false,["decrypt"]);
  const acc=JSON.parse(new TextDecoder().decode(await crypto.subtle.decrypt({name:"AES-GCM",iv:u(ent.i)},w,u(ent.c))));
  const k=await crypto.subtle.importKey("raw",u(acc.k),"AES-GCM",false,["decrypt"]);
  const html=new TextDecoder().decode(await crypto.subtle.decrypt({name:"AES-GCM",iv:u(D.i)},k,u(D.c)));
  try{ sessionStorage.setItem(NS+"gate",pw); sessionStorage.setItem(NS+"login",JSON.stringify(acc.ctr||{admin:1})); }catch(e){}
  if(greet){ const t=document.querySelector("#sign .txt"); t.textContent=(acc.ctr?acc.ctr.name+" 담당자님, ":"")+"환영합니다!"; document.getElementById("sign").classList.add("welcome"); await new Promise(r=>setTimeout(r,1600)); }
  document.open(); document.write(html); document.close();
}

(function(){ const R=document.querySelector(".runner"); if(!R) return; const G=R.querySelector(".guy"), docs=[...R.querySelectorAll(".doc")], B=document.getElementById("sign"), C=document.getElementById("cnt");
  const still=matchMedia("(prefers-reduced-motion: reduce)").matches;
  const lay=()=>docs.forEach(d=>d.style.left=(R.clientWidth*+d.dataset.x-7)+"px"); lay(); addEventListener("resize",lay);
  if(still) return;
  const DUR=6000; let t0=performance.now(), got=new Set(), score=0;
  const say=(d,i)=>{ const p=document.createElement("div"); p.className="pop"+(i===2?" up":""); p.textContent=(i===2?"♥ ":"▼ ")+d.dataset.t; p.style.left=(parseFloat(d.style.left)+7)+"px"; R.appendChild(p); setTimeout(()=>p.remove(),1250);
    B.classList.remove("hop"); void B.offsetWidth; B.classList.add("hop"); G.classList.add("jump"); setTimeout(()=>G.classList.remove("jump"),140); };
  (function tick(now){ let k=(now-t0)/DUR; if(k>=1){ t0=now; k=0; got.clear(); docs.forEach(d=>d.classList.remove("got")); }
    const W=R.clientWidth, x=-40+k*(W+44); G.style.left=x+"px";
    docs.forEach((d,i)=>{ if(!got.has(i)&&x+30>=parseFloat(d.style.left)){ got.add(i); d.classList.add("got"); say(d,i); } });
    requestAnimationFrame(tick); })(t0);
})();
document.getElementById("f").onsubmit=async e=>{ e.preventDefault(); const b=document.getElementById("go"), m=document.getElementById("msg");
  b.disabled=true; m.textContent=""; try{ await open_(document.getElementById("pw").value,true); }catch(err){ m.textContent="비밀번호가 맞지 않습니다."; b.disabled=false; document.getElementById("pw").select(); } };
(async()=>{ let pw=null; try{ pw=sessionStorage.getItem(NS+"gate"); }catch(e){} if(pw){ try{ await open_(pw); }catch(e){ try{ sessionStorage.removeItem(NS+"gate"); localStorage.removeItem(KEEP); }catch(_){} } } })();
</script></body></html>
